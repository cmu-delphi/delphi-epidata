name: Track severe alerts for requirements.api.txt

on:
  push:
    branches:
      - bc/add-dependabot-workflow
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "When true, do not create/update issue"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  track-severe-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Check required token secret
        id: token_check
        env:
          DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
        run: |
          if [[ -n "$DEPENDABOT_ALERTS_TOKEN" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight token access and policy check
        id: preflight
        if: ${{ steps.token_check.outputs.ready == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          script: |
            try {
              await github.request("GET /repos/{owner}/{repo}", {
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput("ready", "true");
              core.setOutput("reason", "ok");
              core.setOutput("message", "Token preflight succeeded.");
            } catch (error) {
              const status = String(error?.status || "unknown");
              const message = (error?.response?.data?.message || error?.message || "Unknown token preflight failure")
                .replace(/\r?\n/g, " ");
              const lower = message.toLowerCase();

              let reason = "access_check_failed";
              if (lower.includes("forbids access via a fine-grained personal access tokens") || lower.includes("lifetime is greater than 366 days")) {
                reason = "token_lifetime_policy";
              } else if (lower.includes("resource not accessible by integration")) {
                reason = "integration_access_denied";
              } else if (lower.includes("sso")) {
                reason = "sso_authorization_required";
              }

              core.setOutput("ready", "false");
              core.setOutput("reason", reason);
              core.setOutput("status", status);
              core.setOutput("message", message);
            }

      - name: Build severe-alert report for requirements.api.txt packages
        id: report
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' }}
        uses: actions/github-script@v7
        env:
          REQUIREMENTS_FILE: requirements.api.txt
        with:
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          script: |
            const fs = require("fs");

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const isRateLimitedError = (error) => {
              const message = (error?.response?.data?.message || error?.message || "").toLowerCase();
              return message.includes("secondary rate limit")
                || message.includes("rate limit");
            };

            const shouldRetry = (error) => {
              const status = error?.status;
              if (status === 403) {
                return isRateLimitedError(error);
              }
              return [429, 502, 503, 504].includes(status);
            };

            const getRetryDelayMs = (error, attempt) => {
              const headers = error?.response?.headers || {};
              const retryAfter = Number(headers["retry-after"] || 0);
              if (Number.isFinite(retryAfter) && retryAfter > 0) {
                return retryAfter * 1000;
              }

              const resetEpoch = Number(headers["x-ratelimit-reset"] || 0);
              if (Number.isFinite(resetEpoch) && resetEpoch > 0) {
                const msUntilReset = (resetEpoch * 1000) - Date.now();
                if (msUntilReset > 0) {
                  return msUntilReset + 1000;
                }
              }

              return Math.min(2000 * (2 ** attempt), 120000);
            };

            const listDependabotAlertsWithBackoff = async () => {
              const maxAttempts = 5;
              const maxTotalWaitMs = 10 * 60 * 1000;
              let totalWaitMs = 0;

              for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
                try {
                  return await github.paginate(
                    "GET /repos/{owner}/{repo}/dependabot/alerts",
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      state: "open",
                      severity: "high,critical",
                      per_page: 100
                    }
                  );
                } catch (error) {
                  if (!shouldRetry(error) || attempt === maxAttempts - 1) {
                    throw error;
                  }

                  const jitterMs = Math.floor(Math.random() * 1000);
                  const delayMs = getRetryDelayMs(error, attempt) + jitterMs;
                  if (totalWaitMs + delayMs > maxTotalWaitMs) {
                    const bounded = new Error("Rate-limit retry budget exceeded.");
                    bounded.status = error?.status;
                    bounded.response = error?.response;
                    bounded.retryBudgetExceeded = true;
                    bounded.originalError = error;
                    throw bounded;
                  }

                  totalWaitMs += delayMs;
                  core.warning(`Dependabot alerts request failed (attempt ${attempt + 1}/${maxAttempts}). Retrying in ${delayMs}ms.`);
                  await sleep(delayMs);
                }
              }

              return [];
            };

            const normalize = (name) =>
              (name || "")
                .trim()
                .toLowerCase()
                .replace(/[_.]+/g, "-");

            const reqFile = process.env.REQUIREMENTS_FILE;
            const raw = fs.readFileSync(reqFile, "utf8");
            const packages = new Set();

            for (const line of raw.split(/\r?\n/)) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#") || trimmed.startsWith("-")) {
                continue;
              }

              const withoutComment = trimmed.split("#", 1)[0].trim();
              const withoutMarker = withoutComment.split(";", 1)[0].trim();
              const nameMatch = withoutMarker.match(/^([A-Za-z0-9._-]+)/);
              if (!nameMatch) {
                continue;
              }
              packages.add(normalize(nameMatch[1]));
            }

            let alerts;
            try {
              alerts = await listDependabotAlertsWithBackoff();
            } catch (error) {
              if (isRateLimitedError(error) || error?.retryBudgetExceeded === true) {
                const now = new Date().toISOString();
                const message = error?.response?.data?.message || error?.message || "Rate limited";
                const headers = error?.response?.headers || {};
                const resetEpoch = Number(headers["x-ratelimit-reset"] || 0);
                const resetIso = Number.isFinite(resetEpoch) && resetEpoch > 0
                  ? new Date(resetEpoch * 1000).toISOString()
                  : "unknown";

                const fallbackBody = [
                  "# Severe dependency alerts for requirements.api.txt",
                  "",
                  `- Repository: ${context.repo.owner}/${context.repo.repo}`,
                  `- Generated: ${now}`,
                  "- Status: skipped due to API throttling",
                  `- API message: ${message}`,
                  `- Rate limit reset (if provided): ${resetIso}`,
                  "",
                  "No issue/email actions were executed for this run.",
                  ""
                ].join("\n");

                core.setOutput("fetch_ok", "false");
                core.setOutput("count", "0");
                core.setOutput("body", fallbackBody);
                core.setOutput("critical_ids", "[]");
                return;
              }

              throw error;
            }

            core.setOutput("fetch_ok", "true");

            const filtered = alerts.filter((alert) => {
              const depName = normalize(alert.dependency?.package?.name || "");
              return packages.has(depName);
            });

            filtered.sort((a, b) => {
              const aSev = a.security_vulnerability?.severity || "";
              const bSev = b.security_vulnerability?.severity || "";
              if (aSev !== bSev) {
                return aSev === "critical" ? -1 : 1;
              }
              const aPkg = normalize(a.dependency?.package?.name || "");
              const bPkg = normalize(b.dependency?.package?.name || "");
              return aPkg.localeCompare(bPkg);
            });

            const now = new Date().toISOString();
            const header = [
              "# Severe dependency alerts for requirements.api.txt",
              "",
              `- Repository: ${context.repo.owner}/${context.repo.repo}`,
              `- Generated: ${now}`,
              `- Severity filter: high, critical`,
              `- Source file: ${reqFile}`,
              `- Matched open alerts: ${filtered.length}`,
              ""
            ];

            const rows = filtered.map((alert) => {
              const sev = (alert.security_vulnerability?.severity || "unknown").toUpperCase();
              const pkg = alert.dependency?.package?.name || "unknown";
              const summary = (alert.security_advisory?.summary || "(no summary)")
                .replace(/\|/g, "\\|")
                .replace(/\r?\n/g, " ");
              const url = alert.html_url || "";
              return `| ${sev} | ${pkg} | ${summary} | [Alert](${url}) |`;
            });

            const criticalIds = filtered
              .filter((alert) => (alert.security_vulnerability?.severity || "") === "critical")
              .map((alert) => String(alert.number))
              .sort((a, b) => Number(a) - Number(b));

            const table = [
              "| Severity | Package | Summary | Link |",
              "|---|---|---|---|",
              ...(rows.length ? rows : ["| N/A | N/A | No open high/critical alerts for requirements.api.txt packages. | N/A |"])
            ];

            const body = [...header, ...table, ""].join("\n");
            core.setOutput("count", String(filtered.length));
            core.setOutput("body", body);
            core.setOutput("critical_ids", JSON.stringify(criticalIds));

      - name: Reconcile tracker issue state
        id: tracker
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.report.outputs.fetch_ok == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: "Security tracker: severe alerts for requirements.api.txt"
          ISSUE_BODY: ${{ steps.report.outputs.body }}
          CURRENT_COUNT: ${{ steps.report.outputs.count }}
          CURRENT_CRITICAL_IDS: ${{ steps.report.outputs.critical_ids }}
        with:
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
          script: |
            const title = process.env.ISSUE_TITLE;
            const bodyBase = process.env.ISSUE_BODY;
            const count = Number(process.env.CURRENT_COUNT || "0");
            const currentCriticalIds = JSON.parse(process.env.CURRENT_CRITICAL_IDS || "[]");

            const markerPrefix = "<!-- critical-alert-ids:";
            const markerSuffix = "-->";

            const trackerBody =
              `${bodyBase}\n${markerPrefix}${JSON.stringify(currentCriticalIds)}${markerSuffix}\n`;

            const findLatestTrackerIssue = async (state) => {
              const issues = await github.paginate(
                "GET /repos/{owner}/{repo}/issues",
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state,
                  per_page: 100
                }
              );

              const candidates = issues
                .filter((issue) => issue.title === title && !issue.pull_request)
                .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

              return candidates[0];
            };

            const latestOpen = await findLatestTrackerIssue("open");

            // Minimize API calls: only scan closed issues when we need to reopen/update an existing tracker.
            let latest = latestOpen;
            if (count > 0 && !latest) {
              latest = await findLatestTrackerIssue("closed");
            }

            const previousBody = latest?.body || "";
            const markerMatch = previousBody.match(/<!-- critical-alert-ids:(.*?)-->/s);
            const previousCriticalIds = markerMatch
              ? JSON.parse(markerMatch[1].trim())
              : [];

            const previousSet = new Set(previousCriticalIds.map((id) => String(id)));
            const newCriticalIds = currentCriticalIds.filter((id) => !previousSet.has(String(id)));

            core.setOutput("new_critical_count", String(newCriticalIds.length));
            core.setOutput("new_critical_ids", JSON.stringify(newCriticalIds));

            if (count > 0) {
              if (latest) {
                if (latest.state === "closed") {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: latest.number,
                    state: "open"
                  });
                }

                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: latest.number,
                  body: trackerBody
                });
                core.info(`Updated issue #${latest.number}`);
                core.setOutput("tracker_issue_number", String(latest.number));
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body: trackerBody,
                  labels: ["security", "dependencies"]
                });
                core.info(`Created issue #${created.data.number}`);
                core.setOutput("tracker_issue_number", String(created.data.number));
              }
            } else if (latestOpen) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: latestOpen.number,
                body: "All matching high/critical alerts are currently resolved. Auto-closing tracker issue."
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: latestOpen.number,
                state: "closed",
                state_reason: "completed"
              });
              core.info(`Closed issue #${latestOpen.number} because no severe alerts remain.`);
              core.setOutput("tracker_issue_number", String(latestOpen.number));
            } else {
              core.info("No severe alerts and no open tracker issue to close.");
            }

      - name: Check SMTP configuration
        id: smtp
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.report.outputs.fetch_ok == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          if [[ -n "$SMTP_SERVER" && -n "$SMTP_PORT" && -n "$SMTP_USERNAME" && -n "$SMTP_PASSWORD" && -n "$SMTP_FROM" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write workflow summary
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' }}
        run: |
          {
            echo "## requirements.api.txt severe alert report"
            echo ""
            echo "Matched open alerts: ${{ steps.report.outputs.count }}"
            echo ""
            echo "${{ steps.report.outputs.body }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight fallback note
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready != 'true' }}
        env:
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          PREFLIGHT_STATUS: ${{ steps.preflight.outputs.status }}
          PREFLIGHT_MESSAGE: ${{ steps.preflight.outputs.message }}
        run: |
          {
            echo "## requirements.api.txt severe alert report"
            echo ""
            echo "Skipped: token preflight check failed."
            echo ""
            echo "HTTP status: ${PREFLIGHT_STATUS:-unknown}"
            echo "Reason: ${PREFLIGHT_REASON:-access_check_failed}"
            echo "Message: ${PREFLIGHT_MESSAGE:-unknown}"
            if [[ "${PREFLIGHT_REASON:-}" == "token_lifetime_policy" ]]; then
              echo ""
              echo "Action: recreate DEPENDABOT_ALERTS_TOKEN with fine-grained PAT lifetime <= 366 days, then update the repository secret."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: API throttling fallback note
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.report.outputs.fetch_ok != 'true' }}
        run: |
          echo "Dependabot alerts API was throttled; issue reconciliation and email notification steps were skipped for this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Token missing fallback note
        if: ${{ steps.token_check.outputs.ready != 'true' }}
        run: |
          {
            echo "## requirements.api.txt severe alert report"
            echo ""
            echo "Skipped: missing secret DEPENDABOT_ALERTS_TOKEN."
            echo ""
            echo "Create a fine-grained PAT with repository permissions: Dependabot alerts (read) and Issues (read/write), then save it as DEPENDABOT_ALERTS_TOKEN."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email new critical alert notification
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.report.outputs.fetch_ok == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false) && fromJSON(steps.tracker.outputs.new_critical_count) > 0 && steps.smtp.outputs.ready == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: >-
            [${{ github.repository }}] New CRITICAL dependency alerts for requirements.api.txt
          to: delphi+sysadmin@andrew.cmu.edu
          from: ${{ secrets.SMTP_FROM }}
          body: |
            New CRITICAL dependency alerts were detected for packages listed in requirements.api.txt.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Tracker issue: #${{ steps.tracker.outputs.tracker_issue_number }}
            New critical alert IDs: ${{ steps.tracker.outputs.new_critical_ids }}

            Full severe-alert report:
            ${{ steps.report.outputs.body }}

      - name: SMTP fallback note
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.report.outputs.fetch_ok == 'true' && (github.event_name == 'schedule' || inputs.dry_run == false) && steps.smtp.outputs.ready != 'true' }}
        env:
          NEW_CRITICAL_COUNT: ${{ steps.tracker.outputs.new_critical_count }}
        run: |
          {
            echo "## Email notification status"
            echo ""
            echo "SMTP secrets are not fully configured; email notification is skipped."
            echo ""
            if [[ "${NEW_CRITICAL_COUNT:-0}" != "0" ]]; then
              echo "New critical alerts found in this run: ${NEW_CRITICAL_COUNT}"
            else
              echo "No new critical alerts in this run."
            fi
            echo ""
            echo "Required secrets: SMTP_SERVER, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD, SMTP_FROM"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run note
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
        run: |
          echo "Dry run enabled: issue creation/update skipped."

      - name: No severe alerts note
        if: ${{ steps.token_check.outputs.ready == 'true' && steps.preflight.outputs.ready == 'true' && steps.report.outputs.fetch_ok == 'true' && fromJSON(steps.report.outputs.count) == 0 }}
        run: |
          echo "No matching high/critical alerts found, so tracker issue update was skipped."